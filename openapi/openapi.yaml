openapi: 3.1.0
info:
  title: Multi-Agent Platform API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/projects/{projectId}/missions:
    post:
      summary: Create mission
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Mission created
  /api/projects/{projectId}/missions/{missionId}:
    get:
      summary: Get mission
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: missionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mission details
  /api/projects/{projectId}/missions/{missionId}/decisions:
    post:
      summary: Create mission decision
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: missionId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Decision created
  /api/projects/{projectId}/missions/{missionId}/documents:
    get:
      summary: List mission documents
      responses:
        "200":
          description: Document list
    post:
      summary: Create mission document
      responses:
        "201":
          description: Document created
  /api/projects/{projectId}/missions/{missionId}/documents/{documentId}/versions:
    post:
      summary: Create document version
      responses:
        "201":
          description: Version created
  /api/projects/{projectId}/missions/{missionId}/documents/{documentId}/adopt:
    post:
      summary: Adopt document version
      responses:
        "201":
          description: Version adopted
  /api/projects/{projectId}/missions/{missionId}/discussions:
    get:
      summary: List discussion sessions
      responses:
        "200":
          description: Discussion sessions
    post:
      summary: Create discussion session
      responses:
        "201":
          description: Discussion session created
  /api/projects/{projectId}/missions/{missionId}/discussions/{sessionId}/rounds:
    post:
      summary: Create discussion round
      responses:
        "201":
          description: Discussion round created
  /api/projects/{projectId}/missions/{missionId}/task-board:
    get:
      summary: Get latest task board
      responses:
        "200":
          description: Task board
    post:
      summary: Create task board
      responses:
        "201":
          description: Task board created
  /api/projects/{projectId}/missions/{missionId}/tasks/{taskId}/claim:
    post:
      summary: Claim task
      responses:
        "201":
          description: Task claimed
  /api/projects/{projectId}/missions/{missionId}/tasks/{taskId}/handoffs:
    post:
      summary: Create task handoff
      responses:
        "201":
          description: Task handoff created
  /api/projects/{projectId}/missions/{missionId}/tasks/{taskId}/review-checkpoints:
    post:
      summary: Create review checkpoint
      responses:
        "201":
          description: Review checkpoint created
  /api/projects/{projectId}/missions/{missionId}/agent-runtimes:
    get:
      summary: List mission agent runtimes
      responses:
        "200":
          description: Agent runtimes
  /api/projects/{projectId}/executor-sessions/{sessionId}:
    get:
      summary: Get executor session
      responses:
        "200":
          description: Executor session
  /api/projects/{projectId}/executor-sessions/{sessionId}/events:
    get:
      summary: List executor session events
      responses:
        "200":
          description: Runtime events
  /api/projects/{projectId}/executor-sessions/{sessionId}/transcript:
    get:
      summary: Get executor transcript
      responses:
        "200":
          description: Transcript view
  /api/projects/{projectId}/executor-sessions/{sessionId}/access-audits:
    get:
      summary: List transcript access audits
      responses:
        "200":
          description: Access audit list
  /api/projects/{projectId}/approvals/{approvalId}:
    get:
      summary: Get approval
      responses:
        "200":
          description: Approval
  /api/projects/{projectId}/repo-candidates/{candidateId}/publish:
    post:
      summary: Create repo candidate publish approval
      responses:
        "201":
          description: Approval created
  /api/projects/{projectId}/missions/{missionId}/archive:
    post:
      summary: Create mission archive
      responses:
        "201":
          description: Mission archive created
    get:
      summary: Get mission archive
      responses:
        "200":
          description: Mission archive
