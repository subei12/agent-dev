openapi: 3.1.0
info:
  title: Multi-Agent Platform API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/projects/{projectId}/missions:
    post:
      summary: Create mission
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Mission created
  /api/projects/{projectId}/missions/{missionId}:
    get:
      summary: Get mission
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: missionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mission details
  /api/projects/{projectId}/missions/{missionId}/decisions:
    post:
      summary: Create mission decision
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: missionId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Decision created
